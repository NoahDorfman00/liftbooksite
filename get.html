<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liftbook: Strength Log</title>
    <meta name="description" content="As simple as a notebook. Free on the App Store.">
    <meta name="robots" content="noindex">
    <!-- The preview Messages and X show for this link: title, one line and the
         app icon — deliberately no og:image, so it renders as a compact
         bubble instead of a full-width card. No meta refresh either: link
         previewers follow those, and would show the App Store's preview. -->
    <meta property="og:title" content="Liftbook: Strength Log">
    <meta property="og:description" content="As simple as a notebook. Free on the App Store.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://liftbookapp.com/get">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Liftbook: Strength Log">
    <meta name="twitter:description" content="As simple as a notebook. Free on the App Store.">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/assets/images/app-icon.png">
    <script>
        // Forward to the App Store, carrying the campaign token from ?ct=
        // (App Store Connect → App Analytics → Sources → Campaigns)
        (function () {
            var ct = new URLSearchParams(location.search).get('ct') || 'website';
            if (!/^[a-z0-9-]{1,40}$/.test(ct)) ct = 'website';
            var url = 'https://apps.apple.com/app/apple-store/id6755925820?pt=128332891&ct=' + ct + '&mt=8';
            window.location.replace(url);
            document.addEventListener('DOMContentLoaded', function () {
                document.getElementById('store-link').href = url;
            });
        })();
    </script>
</head>

<body>
    <p>Taking you to <a id="store-link" href="https://apps.apple.com/app/apple-store/id6755925820?pt=128332891&amp;ct=website&amp;mt=8">Liftbook on the App Store</a>…</p>
</body>

</html>
